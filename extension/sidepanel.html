<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gold Desk</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Gold Desk</h1>
        <p class="sub">XAU/USD · live</p>
      </div>
      <span class="badge">AI analyst</span>
    </header>

    <section class="price">
      <div>
        <div id="price" class="big">—</div>
        <div id="change" class="muted">loading…</div>
      </div>
    </section>

    <div class="row" id="tfs"></div>

    <section id="stats" class="grid"></section>

    <section class="levels">
      <div>
        <div class="cap bear">Resistance</div>
        <div id="res"></div>
      </div>
      <div>
        <div class="cap bull">Support</div>
        <div id="sup"></div>
      </div>
    </section>

    <div class="row" id="modes"></div>

    <textarea id="q" rows="2" placeholder="Optional: ask something specific…"></textarea>

    <div class="row gap">
      <button id="attach" class="ghost">Attach chart</button>
      <button id="clear" class="link hidden">remove</button>
      <input id="file" type="file" accept="image/*" hidden />
    </div>

    <button id="run" class="primary">Run analysis</button>

    <div id="out" class="out muted">
      Keep this panel open next to your chart. Pick a timeframe, choose what you want, and run the
      analysis.
    </div>

    <footer>Price feed: PAXG/USDT (gold-backed). Educational use only — not financial advice.</footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
